name: bootstrap-npm-publish

on:
  workflow_dispatch:
    inputs:
      duty:
        description: "Duty action to run"
        type: string
        default: "npm-publish"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: pnpm exec tsx bin/kody.ts ci --skip-install --skip-litellm

