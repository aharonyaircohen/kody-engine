name: retry live release gate

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:live-release
        env:
          KODY_RELEASE_GATE_TOKEN: ${{ secrets.KODY_TOKEN }}
      # This independent repository must not enter the engine's pnpm workspace
      # during frozen dependency installation.
      - name: Checkout current Store definitions
        uses: actions/checkout@v4
        with:
          repository: aharonyaircohen/kody-ai-agency-catalog
          ref: main
          path: _live/kody-store
      - name: Verify CI Repair twice from failure to green
        run: node _live/kody-store/scripts/ci-repair-live-gate.mjs
        env:
          KODY_CI_REPAIR_GATE_TOKEN: ${{ secrets.KODY_TOKEN }}
