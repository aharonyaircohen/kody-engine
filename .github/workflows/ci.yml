name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - name: Configure git identity (for integration tests)
        run: |
          git config --global user.name  "kody-test"
          git config --global user.email "test@kody"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:smoke
      # TEMP DIAGNOSTIC: forks pool (so process.chdir works), one sequential
      # child, with Node --report-on-signal. On a >360s hang we SIGUSR2 every
      # node process; the stuck fork writes a diagnostic report to /tmp/nrep,
      # and we print its cwd + active libuv handles (open socket/child/timer)
      # to name the offending test. Revert to `pnpm test` once fixed.
      - name: Run tests (probe — NO coverage)
        run: |
          set +e   # post-kill non-zero must not abort before we print the verdict
          node node_modules/vitest/vitest.mjs run tests/unit tests/int \
            --no-file-parallelism --reporter=dot &
          TPID=$!
          ( sleep 240
            echo "::warning::STILL HANGS without coverage — so coverage is NOT the cause"
            ps -e -o pid,ppid,stat,etime,args 2>/dev/null | grep -E "forks\.js" | grep -v grep
            sleep 2
            pkill -9 node 2>/dev/null; kill -9 "$TPID" 2>/dev/null
          ) &
          WPID=$!
          wait "$TPID"; RC=$?
          kill "$WPID" 2>/dev/null
          echo "PROBE RESULT: exit=$RC  (0 = completed → COVERAGE was the cause; 137 = still hung → not coverage)"
          exit "$RC"
      - run: pnpm test:e2e
