name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - name: Configure git identity (for integration tests)
        run: |
          git config --global user.name  "kody-test"
          git config --global user.email "test@kody"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:smoke
      # TEMP DIAGNOSTIC: forks pool (so process.chdir works), one sequential
      # child, with Node --report-on-signal. On a >360s hang we SIGUSR2 every
      # node process; the stuck fork writes a diagnostic report to /tmp/nrep,
      # and we print its cwd + active libuv handles (open socket/child/timer)
      # to name the offending test. Revert to `pnpm test` once fixed.
      - name: Run tests (dump handles on hang)
        run: |
          set +e   # do NOT let `wait` returning 137 (post-kill) abort before we print the report
          export NODE_OPTIONS="--report-on-signal"
          node node_modules/vitest/vitest.mjs run tests/unit tests/int \
            --coverage --no-file-parallelism --reporter=verbose &
          TPID=$!
          ( sleep 300
            echo "::warning::test suite hung >300s — signalling node for diagnostic report"
            pkill -USR2 -x node 2>/dev/null || kill -USR2 "$TPID" 2>/dev/null
            sleep 12
            pkill -9 -x node 2>/dev/null; kill -9 "$TPID" 2>/dev/null
          ) &
          WPID=$!
          wait "$TPID"; RC=$?
          kill "$WPID" 2>/dev/null
          echo "=== diagnostic reports (cwd + active libuv handles) ==="
          shopt -s nullglob
          found=0
          for f in report.*.json; do
            found=1
            echo "--- $f ---"
            cat "$f" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);console.log('cwd:',r.header&&r.header.cwd);const h=(r.libuvHandles||r.libuv||[]).filter(x=>x.is_active);console.log(JSON.stringify(h,null,2))})"
          done
          [ "$found" = 1 ] || echo "(no report.*.json — suite did not hang)"
          exit "$RC"
      - run: pnpm test:e2e
