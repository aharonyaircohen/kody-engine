name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - name: Configure git identity (for integration tests)
        run: |
          git config --global user.name  "kody-test"
          git config --global user.email "test@kody"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:smoke
      # TEMP DIAGNOSTIC: forks pool (so process.chdir works), one sequential
      # child, with Node --report-on-signal. On a >360s hang we SIGUSR2 every
      # node process; the stuck fork writes a diagnostic report to /tmp/nrep,
      # and we print its cwd + active libuv handles (open socket/child/timer)
      # to name the offending test. Revert to `pnpm test` once fixed.
      - name: Run tests (JS stack on hang)
        run: |
          set +e
          export NODE_OPTIONS="--report-on-signal"
          node node_modules/vitest/vitest.mjs run tests/unit tests/int \
            --no-file-parallelism --reporter=dot &
          TPID=$!
          ( sleep 240
            echo "::warning::hung — requesting diagnostic report (JS stack) from the spinning worker"
            WPIDS=$(ps -e -o pid,args 2>/dev/null | grep -E "forks\.js" | grep -v grep | awk '{print $1}')
            echo "worker pids: $WPIDS ; main: $TPID"
            for p in $WPIDS "$TPID"; do kill -USR2 "$p" 2>/dev/null; done
            sleep 12
            pkill -9 node 2>/dev/null; kill -9 "$TPID" 2>/dev/null
          ) &
          WPID=$!
          wait "$TPID"; RC=$?
          kill "$WPID" 2>/dev/null
          echo "=== diagnostic reports: JS STACK = the infinite loop ==="
          for f in $(find / -name 'report.*.json' 2>/dev/null); do
            echo "--- $f ---"
            cat "$f" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s);console.log('cwd:',r.header&&r.header.cwd);console.log('JS STACK:');console.log((r.javascriptStack&&r.javascriptStack.stack)||'(none)')}catch(e){console.log('parse err',e.message)}})"
          done
          exit "$RC"
      - run: pnpm test:e2e
