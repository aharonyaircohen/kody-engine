name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - name: Configure git identity (for integration tests)
        run: |
          git config --global user.name  "kody-test"
          git config --global user.email "test@kody"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:smoke
      # TEMP DIAGNOSTIC: forks pool (so process.chdir works), one sequential
      # child, with Node --report-on-signal. On a >360s hang we SIGUSR2 every
      # node process; the stuck fork writes a diagnostic report to /tmp/nrep,
      # and we print its cwd + active libuv handles (open socket/child/timer)
      # to name the offending test. Revert to `pnpm test` once fixed.
      - name: Run tests (worker tick profile on hang)
        run: |
          set +e
          node node_modules/vitest/vitest.mjs run tests/unit tests/int \
            --no-file-parallelism --reporter=dot &
          TPID=$!
          ( sleep 240
            echo "::warning::hung — worker argv (must contain --prof) then kill"
            ps -e -o pid,args 2>/dev/null | grep -E "forks\.js" | grep -v grep
            sleep 3
            pkill -9 node 2>/dev/null; kill -9 "$TPID" 2>/dev/null
          ) &
          WPID=$!
          wait "$TPID"; RC=$?
          kill "$WPID" 2>/dev/null
          echo "=== isolate tick logs ==="
          ls -la isolate-*.log 2>/dev/null || echo "(none)"
          echo "=== prof-process (largest log = spinning worker; look for RegExp / a src .ts) ==="
          for log in $(ls -S isolate-*.log 2>/dev/null); do
            echo "--- $log ---"
            node --prof-process "$log" 2>/dev/null | sed -n '1,70p'
          done
          exit "$RC"
      - run: pnpm test:e2e
