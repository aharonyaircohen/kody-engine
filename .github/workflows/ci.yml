name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - name: Configure git identity (for integration tests)
        run: |
          git config --global user.name  "kody-test"
          git config --global user.email "test@kody"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:smoke
      # TEMP DIAGNOSTIC: forks pool (so process.chdir works), one sequential
      # child, with Node --report-on-signal. On a >360s hang we SIGUSR2 every
      # node process; the stuck fork writes a diagnostic report to /tmp/nrep,
      # and we print its cwd + active libuv handles (open socket/child/timer)
      # to name the offending test. Revert to `pnpm test` once fixed.
      - name: Run tests (dump process tree on hang)
        run: |
          set +e   # don't let post-kill non-zero exits abort before we print diagnostics
          node node_modules/vitest/vitest.mjs run tests/unit tests/int \
            --coverage --no-file-parallelism --reporter=verbose &
          TPID=$!
          ( sleep 300
            echo "::warning::test suite hung >300s — dumping process tree (the stuck leaf is the blocking command)"
            echo "=== FULL PROCESS TREE ==="
            ps -e -o pid,ppid,stat,etime,args 2>/dev/null || ps auxww
            echo "=== NON-NODE / NON-PS LEAVES (likely culprit: gh/git/bash/curl/npx) ==="
            ps -e -o pid,ppid,stat,etime,args 2>/dev/null | grep -ivE "\b(node|ps|sleep|bash /home/runner/work/_temp|/usr/bin/bash -e)\b" | tail -30
            sleep 8
            pkill -9 node 2>/dev/null; kill -9 "$TPID" 2>/dev/null
          ) &
          WPID=$!
          wait "$TPID"; RC=$?
          kill "$WPID" 2>/dev/null
          exit "$RC"
      - run: pnpm test:e2e
