name: release

on:
  workflow_dispatch:

concurrency:
  group: kody-engine-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout current Store definitions
        uses: actions/checkout@v4
        with:
          repository: aharonyaircohen/kody-ai-agency-catalog
          ref: main
          path: _live/kody-store
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --no-frozen-lockfile
      - name: Publish Engine
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify released Engine end to end
        run: pnpm verify:live-release
        env:
          KODY_RELEASE_GATE_TOKEN: ${{ secrets.KODY_TOKEN }}
      - name: Verify CI Repair twice from failure to green
        run: node _live/kody-store/scripts/ci-repair-live-gate.mjs
        env:
          KODY_CI_REPAIR_GATE_TOKEN: ${{ secrets.KODY_TOKEN }}
