app = "kody-litellm"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# One always-on machine — the whole point of this app is to avoid the
# ~24s LiteLLM cold-start that the per-session runner pays today.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[[services]]
  internal_port = 4000
  protocol = "tcp"
  # auto_stop_machines = false keeps the proxy hot. min_machines_running
  # guarantees at least one is always up even if Fly's scheduler decides
  # to migrate the machine for maintenance.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 4000
    handlers = ["http"]

  [services.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health/liveliness"
