app = "kody-pool"
primary_region = "fra"

[build]
  dockerfile = "pool-server/Dockerfile"

[env]
  NODE_ENV = "production"
  POOL_DISABLE_LITELLM = "1"
  POOL_API_PORT = "4100"
  POOL_API_HOST = "::"
  POOL_RUNNER_APP = "kody-runner"
  POOL_REGION = "fra"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[services]]
  internal_port = 4100
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [services.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/healthz"
